MEMORY {
    ZP: start=$0002, size=$001a, type=rw;
    RAM: start=$5000, size=$1000, type=rw;
    LOW: start=$1000, size=$2000, type=rw, file="%O.low";
    BANK: start=$d400, size=$2b00, type=rw, file="%O.bank";
    CODE: start=$8000, size=$4000, type=rw, file=%O;
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp;
    STARTUP: load=CODE, type=ro;
    CODE: load=CODE, type=ro;
    BATTLE: load=BANK, type=ro;
    LOWCODE: load=LOW, type=ro;
    RODATA: load=CODE, type=ro;
    DATA: load=CODE, type=rw;
    BSS: load=RAM, type=bss, define=yes;
}
