name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow numpy
      - run: python3 tools/build.py --test
      - name: Rebuild is byte-identical
        run: |
          sha256sum dist/MegaLoMania64.prg dist/MegaLoMania64.d64 > /tmp/a
          python3 tools/build.py
          sha256sum dist/MegaLoMania64.prg dist/MegaLoMania64.d64 > /tmp/b
          diff /tmp/a /tmp/b
